<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --night-1: #0a0a18;       /* deepest sky */
    --night-2: #131330;       /* mid sky */
    --night-3: #1f1d4a;       /* upper sky */
    --indigo: #2a2473;
    --dusk: #5b4d8e;
    --moon: #f5e6c8;          /* warm moon glow */
    --moon-cool: #e8e4f5;     /* cool moon glow */
    --cream: #f4ecdc;
    --cream-soft: #d9d3c4;
    --muted: #8a85a8;
    --accent: #f5e6c8;
    --line: rgba(245, 230, 200, 0.14);

    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--night-1);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: var(--moon); color: var(--night-1); }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* Stars background — fixed full-viewport canvas */
  #starfield {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* Page wrapper sits above starfield */
  #app { position: relative; z-index: 1; }

  /* Top nav */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 56px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cream-soft);
    mix-blend-mode: difference;
  }
  .nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .nav .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 12px var(--moon);
  }
  .nav ul { list-style: none; display: flex; gap: 32px; margin: 0; padding: 0; }
  .nav a { opacity: 0.7; transition: opacity .2s; }
  .nav a:hover { opacity: 1; }

  /* Generic section */
  section {
    position: relative;
    padding: 90px 56px;
    max-width: 1440px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 8px var(--moon);
  }

  h1, h2, h3 {
    font-family: var(--serif);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    color: var(--cream);
  }
  h1 { font-size: clamp(48px, 8vw, 128px); }
  h2 { font-size: clamp(36px, 5vw, 72px); }
  h3 { font-size: clamp(24px, 3vw, 36px); }

  .serif-italic { font-style: italic; font-family: var(--serif); }

  p { font-size: 17px; line-height: 1.65; color: var(--cream-soft); max-width: 62ch; }

  /* Reveal-on-scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.in { opacity: 1; transform: none; }
  /* Failsafe: if JS hasn't toggled .in within ~3s of load, force-reveal so
     content is never permanently invisible. */
  @keyframes __force_reveal { to { opacity: 1; transform: none; } }
  .reveal { animation: __force_reveal .9s ease 3s forwards; }
  .reveal.in { animation: none; }

  /* Moon phase divider */
  .phase-divider {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 32px 0;
    opacity: 0.65;
  }
  .phase-divider .phase {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--moon-cool);
    box-shadow: 0 0 10px rgba(232, 228, 245, 0.5);
    flex-shrink: 0;
  }
  .phase-divider .phase.p1 { box-shadow: inset -7px 0 0 var(--night-1), 0 0 6px rgba(232,228,245,.25); }
  .phase-divider .phase.p2 { box-shadow: inset -3px 0 0 var(--night-1), 0 0 8px rgba(232,228,245,.35); }
  .phase-divider .phase.p3 { box-shadow: 0 0 14px rgba(232,228,245,.6); }
  .phase-divider .phase.p4 { box-shadow: inset 3px 0 0 var(--night-1), 0 0 8px rgba(232,228,245,.35); }
  .phase-divider .phase.p5 { box-shadow: inset 7px 0 0 var(--night-1), 0 0 6px rgba(232,228,245,.25); }

  /* Hero */
  .hero {
    min-height: 100vh;
    padding: 0 56px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    max-width: 1440px;
    margin: 0 auto;
  }
  .hero-text { padding-top: 80px; }
  .hero-text .greet {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--moon);
    margin-bottom: 24px;
  }
  .hero h1 .it { font-style: italic; color: var(--moon); }

  /* Stacked hero headline */
  .hero-stack {
    display: flex;
    flex-direction: column;
    gap: 0.12em;
    line-height: 1.05;
    font-size: clamp(56px, 7.6vw, 108px);
    letter-spacing: -0.025em;
  }
  .hero-stack .line {
    display: flex;
    align-items: baseline;
    gap: 0.22em;
    flex-wrap: wrap;
  }
  .hero-stack .word { display: inline-block; }
  .hero-stack .word.big {
    font-size: 0.92em;
    letter-spacing: -0.035em;
  }
  .hero-stack .word.small-and {
    font-style: italic;
    color: var(--moon);
    font-size: 0.5em;
    font-weight: 400;
    align-self: center;
  }
  .hero-stack .word.it {
    font-style: italic;
    color: var(--moon);
    font-size: 0.62em;
    font-weight: 400;
    letter-spacing: -0.01em;
    align-self: center;
  }
  .hero-stack .amp {
    font-style: italic;
    color: var(--moon);
    font-weight: 400;
    font-size: 0.92em;
    padding: 0 0.04em;
  }
  .hero-stack .line-1 {
    font-size: 0.66em;
    letter-spacing: -0.02em;
  }
  .hero-stack .line-3 {
    font-size: 0.5em;
    margin-top: 14px;
    align-items: center;
    gap: 0.32em;
  }
  /* Empath stamp — small badge floating next to "Designer" */
  .hero-stack .stamp {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--moon);
    border: 1px solid rgba(232, 228, 245, 0.28);
    border-radius: 999px;
    padding: 6px 14px;
    align-self: center;
    margin-left: 8px;
    background: rgba(26, 21, 56, 0.4);
    backdrop-filter: blur(4px);
    transform: translateY(-0.18em);
  }
  .hero-stack .stamp::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 8px var(--moon);
  }
  /* "01" numeric — typewriter style with the 0 dimmer */
  .hero-stack .numeric {
    display: inline-flex;
    align-items: baseline;
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-right: 0.05em;
  }
  .hero-stack .numeric .num-zero {
    color: var(--muted);
    opacity: 0.55;
  }
  .hero-stack .numeric .num-one {
    color: var(--cream);
  }
  @media (max-width: 720px) {
    .hero-stack { font-size: clamp(44px, 12vw, 80px); }
    .hero-stack .stamp { font-size: 9px; padding: 4px 10px; }
  }
  .hero-text .sub {
    margin-top: 32px;
    font-size: 18px;
    color: var(--cream-soft);
    max-width: 46ch;
    line-height: 1.6;
  }
  .hero-meta {
    margin-top: 48px;
    display: flex;
    gap: 28px;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero-meta .pulse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .hero-meta .pulse::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #7ee0a4;
    box-shadow: 0 0 6px #7ee0a4;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Moon */
  .moon-stage {
    position: relative;
    width: 100%;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .moon {
    position: relative;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: #d8cdb0;
    box-shadow:
      0 0 80px rgba(245, 230, 200, 0.22),
      0 0 200px rgba(245, 230, 200, 0.15),
      0 0 300px rgba(232, 228, 245, 0.08);
    overflow: hidden;
    isolation: isolate;
  }
  /* Subtle breathing — moon gently floats */
  @keyframes moonBreathe {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 30px rgba(245,230,200,0.18)); }
    50% { filter: brightness(1.06) drop-shadow(0 0 50px rgba(245,230,200,0.28)); }
  }
  .moon svg.moon-surface {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    animation: moonBreathe 6s ease-in-out infinite;
  }
  /* NASA photo moon variant */
  .moon.moon-photo { background: #000; }
  .moon.moon-photo .moon-photo-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-image: url("https://svs.gsfc.nasa.gov/vis/a000000/a004400/a004442/frames/730x730_1x1_30p/moon.0001.jpg");
    background-size: 110% 110%;
    background-position: center;
    background-repeat: no-repeat;
    filter: contrast(1.05) brightness(1.05);
  }
  /* hide ::after dimming + ::before glow when using photo (photo carries its own lighting) */
  .moon.moon-photo::after { opacity: 0.35; mix-blend-mode: multiply; }
  .moon.moon-photo::before { box-shadow: inset 0 0 30px rgba(255,250,235,0.18), inset -10px -10px 60px rgba(0,0,0,0.35); }
  /* terminator (subtle dark side gradient — sun roughly upper-left) */
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%,
        rgba(255, 250, 235, 0.35) 0%,
        rgba(255, 250, 235, 0) 35%),
      radial-gradient(circle at 78% 78%,
        rgba(0, 0, 0, 0.55) 0%,
        rgba(0, 0, 0, 0) 60%),
      radial-gradient(circle at 50% 50%,
        rgba(0, 0, 0, 0) 60%,
        rgba(0, 0, 0, 0.35) 100%);
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  /* atmospheric glow rim */
  .moon::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    box-shadow:
      inset 0 0 30px rgba(255, 250, 235, 0.15),
      inset 8px 8px 24px rgba(255, 250, 235, 0.18),
      inset -20px -20px 60px rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }

  .orbit {
    position: absolute;
    inset: -60px;
    border: 1px dashed rgba(245, 230, 200, 0.18);
    border-radius: 50%;
    animation: orbit-spin 60s linear infinite;
  }
  .orbit::after {
    content: "";
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 10px var(--moon);
    transform: translateX(-50%);
  }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  .orbit-2 {
    position: absolute;
    inset: -120px;
    border: 1px dashed rgba(245, 230, 200, 0.08);
    border-radius: 50%;
  }

  /* Constellation lines svg */
  .constellation {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.4;
  }

  /* About */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 96px;
    align-items: start;
  }
  .about-portrait {
    aspect-ratio: 3 / 4;
    background: linear-gradient(180deg, var(--night-3), var(--night-2));
    border: 1px solid var(--line);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .about-portrait .corner {
    position: absolute;
    width: 14px; height: 14px;
    border: 1px solid var(--moon);
    opacity: 0.5;
  }
  .about-portrait .corner.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .about-portrait .corner.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .about-portrait .corner.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .about-portrait .corner.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .portrait-caption {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .portrait-caption-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream-soft);
  }
  .portrait-caption-note {
    margin-top: 10px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--moon);
  }

  .about-text h2 { margin-bottom: 32px; }
  .about-text .lead {
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.4;
    color: var(--cream);
    margin: 0 0 32px;
    font-style: italic;
    font-weight: 300;
  }
  .about-text p + p { margin-top: 20px; }

  .traits {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    margin-top: 56px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }
  .trait { display: flex; gap: 16px; align-items: flex-start; }
  .trait-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--moon);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-style: italic;
    color: var(--moon);
    flex-shrink: 0;
    font-size: 16px;
  }
  .trait-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .trait-text { font-size: 15px; color: var(--cream-soft); line-height: 1.5; }

  /* Selected Work */
  .work-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 80px;
  }
  .work-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .work-item {
    display: grid;
    grid-template-columns: 80px 1.6fr 1fr;
    gap: 40px;
    padding: 36px 0;
    border-top: 1px solid var(--line);
    align-items: start;
    cursor: pointer;
    transition: padding-left .3s ease, background .3s ease;
    position: relative;
  }
  .work-item:last-child { border-bottom: 1px solid var(--line); }
  .work-item:hover { padding-left: 24px; }
  .work-num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .work-title { font-family: var(--serif); font-size: 32px; line-height: 1.15; color: var(--cream); margin-bottom: 10px; }
  .work-summary { font-size: 14px; line-height: 1.6; color: var(--cream-soft); max-width: 52ch; margin: 0; }
  .work-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream-soft);
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .work-item, a.work-item { display: grid; text-decoration: none; }

  /* Case study carousel */
  .cs-carousel {
    margin-top: 120px;
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(31, 29, 74, 0.4), rgba(19, 19, 48, 0.4));
    backdrop-filter: blur(8px);
  }
  .cs-track {
    display: flex;
    transition: transform .6s cubic-bezier(.3,.7,.3,1);
  }
  .cs-cover {
    width: 100%;
    aspect-ratio: 21 / 9;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 32px;
    border: 1px solid var(--line);
  }
  .cs-card {
    flex: 0 0 100%;
    padding: 56px;
    box-sizing: border-box;
  }
  .cs-lists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-top: 36px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }
  .cs-card h4 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 500;
  }
  .cs-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .cs-list li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--cream-soft);
    padding-left: 20px;
    position: relative;
  }
  .cs-list li::before {
    content: "";
    position: absolute;
    left: 0; top: 7px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 6px var(--moon);
  }
  .cs-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(10, 10, 24, 0.6);
    color: var(--cream);
    font-family: var(--serif);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .cs-nav:hover { background: rgba(245,230,200,0.14); border-color: rgba(245,230,200,0.4); }
  .cs-prev { left: 20px; }
  .cs-next { right: 20px; }
  .cs-dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .cs-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(245,230,200,0.25);
    cursor: pointer;
    transition: background .2s;
  }
  .cs-dot.active { background: var(--moon); box-shadow: 0 0 8px var(--moon); }

  /* Things I Love */
  .loves-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
    margin-top: 40px;
  }
  .love {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(19, 19, 48, 0.3);
    backdrop-filter: blur(4px);
    transition: transform .4s ease, border-color .4s ease, background .4s ease;
    position: relative;
    overflow: hidden;
    min-height: 130px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .love:hover {
    transform: translateY(-4px);
    border-color: rgba(245, 230, 200, 0.4);
    background: rgba(31, 29, 74, 0.4);
  }
  .love .love-cap {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .love .love-title { font-family: var(--serif); font-size: 22px; line-height: 1.15; color: var(--cream); margin-top: 16px; }
  .love .love-sub { font-size: 13px; color: var(--cream-soft); margin-top: 6px; }

  .love.span-6 { grid-column: span 6; }
  .love.span-12 { grid-column: span 12; }
  .love.span-4 { grid-column: span 4; }
  .love.span-3 { grid-column: span 3; }
  .love.span-5 { grid-column: span 5; }
  .love.span-7 { grid-column: span 7; }
  .love.tall { min-height: 180px; }

  .love.moon-card {
    background:
      radial-gradient(circle at 80% 30%, rgba(245, 230, 200, 0.4) 0%, rgba(245, 230, 200, 0.1) 25%, transparent 50%),
      linear-gradient(135deg, var(--night-3), var(--night-2));
  }
  .love.travel-card {
    background:
      linear-gradient(180deg, rgba(91, 77, 142, 0.3), rgba(31, 29, 74, 0.5));
  }

  /* Experience timeline */
  .timeline {
    margin-top: 56px;
    position: relative;
    padding-left: 32px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: linear-gradient(180deg, var(--moon), var(--line) 30%, var(--line));
  }
  .timeline-item {
    display: grid;
    grid-template-columns: 140px 1fr 1fr;
    gap: 48px;
    padding: 28px 0;
    border-top: 1px solid var(--line);
    position: relative;
    align-items: start;
  }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: -32px;
    top: 36px;
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1px solid var(--moon);
    background: var(--night-1);
  }
  .timeline-item.current::before {
    background: var(--moon);
    box-shadow: 0 0 12px var(--moon);
  }
  .timeline-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .timeline-role { font-family: var(--serif); font-size: 24px; line-height: 1.2; color: var(--cream); }
  .timeline-co { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--moon); margin-top: 6px; }
  .timeline-desc { font-size: 14px; line-height: 1.55; color: var(--cream-soft); }

  /* Contact */
  .contact {
    text-align: center;
    padding-top: 200px;
    padding-bottom: 200px;
  }
  .contact h2 {
    font-size: clamp(48px, 9vw, 140px);
    line-height: 1.15;
    margin-bottom: 32px;
  }
  .contact h2 .it { font-style: italic; color: var(--moon); }
  .contact .email {
    font-family: var(--serif);
    font-style: italic;
    font-size: 32px;
    color: var(--moon);
    margin-top: 32px;
    display: inline-block;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(245, 230, 200, 0.4);
    transition: border-color .3s;
  }
  .contact .email:hover { border-color: var(--moon); }
  .contact-links {
    margin-top: 64px;
    display: flex;
    justify-content: center;
    gap: 40px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-soft);
  }
  .contact-links a { padding-bottom: 4px; border-bottom: 1px solid transparent; transition: border-color .3s, color .3s; }
  .contact-links a:hover { border-color: var(--moon); color: var(--moon); }

  /* Footer */
  footer {
    border-top: 1px solid var(--line);
    padding: 32px 56px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    max-width: 1440px;
    margin: 0 auto;
  }

  /* Tweak: minimal layout overrides */
  body[data-density="cozy"] section { padding-top: 60px; padding-bottom: 60px; }
  body[data-density="airy"] section { padding-top: 130px; padding-bottom: 130px; }

  /* Responsive */
  @media (max-width: 900px) {
    .nav { padding: 18px 24px; }
    .nav ul { display: none; }
    section { padding: 80px 24px; }
    .hero { padding: 0 24px; grid-template-columns: 1fr; min-height: auto; padding-top: 100px; padding-bottom: 60px; }
    .moon-stage { height: 360px; }
    .moon { width: 280px; height: 280px; }
    .about-grid { grid-template-columns: 1fr; gap: 48px; }
    .work-item { grid-template-columns: 1fr; gap: 16px; padding: 28px 0; }
    .work-arrow { display: none; }
    .featured-head, .featured-body { padding: 32px; grid-template-columns: 1fr; gap: 24px; }
    .cs-card { padding: 32px; }
    .cs-lists { grid-template-columns: 1fr; }
    .cs-nav { width: 36px; height: 36px; font-size: 16px; }
    .cs-prev { left: 10px; }
    .cs-next { right: 10px; }
    .loves-grid { grid-template-columns: 1fr; }
    .love.span-3, .love.span-4, .love.span-5, .love.span-6, .love.span-7 { grid-column: 1 / -1; }
    .timeline-item { grid-template-columns: 1fr; gap: 8px; }
    .contact .email { font-size: 22px; }
  }
</style>
